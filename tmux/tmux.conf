# Plugin manager
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Theme
set -g @catppuccin_flavor 'mocha' # or frappe, macchiato, latte

# Session persistence
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'

# ==============================================================================
# General Settings
# ==============================================================================

# Use C-a as prefix (like GNU Screen)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Enable mouse support
set -g mouse on

# Improve colors
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:Tc,xterm-256color:Tc"
set -g default-shell /bin/zsh

# Reduce Escape delay in terminal editors
set -sg escape-time 0

# Increase scrollback buffer
set -g history-limit 10000

# Start window/pane numbering at 1
set -g base-index 1
set-window-option -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# ==============================================================================
# Key Bindings
# ==============================================================================

# Easy config reload
bind r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

# Better window splits (use current path)
bind - split-window -v -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"

# Faster window switching
bind C-p previous-window
bind C-n next-window

# Copy to system clipboard (macOS)
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# ==============================================================================
# Local Config
# ==============================================================================

if-shell "[ -f ~/.tmux.conf.local ]" "source ~/.tmux.conf.local"
set -g extended-keys on
set -ga terminal-features ",xterm*:extkeys,ghostty:extkeys,tmux-256color:extkeys"

# Initialize TPM last.
run '~/.tmux/plugins/tpm/tpm'
